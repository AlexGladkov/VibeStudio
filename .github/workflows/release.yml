# ============================================================
# VibeStudio — Release Pipeline
# Triggers on push of version tags (v*).
# Builds → Developer ID sign → notarize → staple → DMG →
# generate Sparkle appcast → publish GitHub Release + GitHub Pages feed.
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  APP_NAME: VibeStudio
  SCHEME: VibeStudio
  BUNDLE_ID: tech.mobiledeveloper.vibestudio
  MIN_MACOS: '14.0'
  XCODE_VERSION: '16.4'
  # Public download location for DMGs (GitHub Releases) — used as the
  # Sparkle appcast enclosure URL prefix.
  DOWNLOAD_REPO: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------
  # Job 1: Build + Sign + Notarize + DMG + Appcast
  # ---------------------------------------------------------------
  build:
    name: Build & Package
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${TAG}, Build: ${GITHUB_RUN_NUMBER}"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Resolve SPM dependencies
        run: make resolve-deps

      - name: Run tests
        run: make test

      # `make export` runs archive (unsigned) + exports the .app.
      # NOTE: do NOT use `make dmg` afterwards — its `export` prerequisite is
      # phony and would re-export a fresh UNSIGNED app over the signed one.
      # We call create-dmg.sh directly after signing instead.
      - name: Export app bundle (unsigned)
        run: |
          make export \
            VERSION=${{ steps.version.outputs.version }} \
            BUILD_NUMBER=${{ steps.version.outputs.build_number }}

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Developer ID sign app (Sparkle-aware)
        run: |
          ./scripts/codesign-app.sh \
            build/export/VibeStudio.app \
            "${{ secrets.APPLE_SIGN_IDENTITY }}" \
            VibeStudio/VibeStudio.entitlements

      - name: Create DMG (from signed app)
        run: |
          ./scripts/create-dmg.sh \
            build/export/VibeStudio.app \
            "build/VibeStudio-${{ steps.version.outputs.version }}.dmg" \
            "${{ steps.version.outputs.version }}"

      - name: Notarize + staple DMG
        env:
          NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ./scripts/notarize.sh "build/VibeStudio-${{ steps.version.outputs.version }}.dmg"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p dist
          cp "build/VibeStudio-${{ steps.version.outputs.version }}.dmg" dist/
          ./scripts/generate-appcast.sh dist \
            "https://github.com/${DOWNLOAD_REPO}/releases/download/${GITHUB_REF_NAME}/"

      - name: Compute DMG checksum
        id: checksum
        run: |
          DMG="build/VibeStudio-${{ steps.version.outputs.version }}.dmg"
          SHA=$(shasum -a 256 "${DMG}" | awk '{print $1}')
          echo "sha256=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "SHA-256: ${SHA}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeStudio-${{ steps.version.outputs.version }}.dmg
          path: build/VibeStudio-${{ steps.version.outputs.version }}.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Upload appcast artifact
        uses: actions/upload-artifact@v4
        with:
          name: appcast
          path: dist/appcast.xml
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Job 2: Create GitHub Release (DMG asset)
  # ---------------------------------------------------------------
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: VibeStudio-${{ steps.version.outputs.version }}.dmg
          path: artifacts/

      - name: Compute checksum
        id: checksum
        run: |
          DMG="artifacts/VibeStudio-${{ steps.version.outputs.version }}.dmg"
          SHA=$(sha256sum "${DMG}" | awk '{print $1}')
          echo "sha256=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VibeStudio v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## VibeStudio v${{ steps.version.outputs.version }}

            ### Installation
            1. Download `VibeStudio-${{ steps.version.outputs.version }}.dmg`
            2. Open the DMG and drag VibeStudio to Applications

            Already have VibeStudio? It will update itself automatically
            (Sparkle) — or use **VibeStudio ▸ Check for Updates…**.

            ### System Requirements
            - macOS 14.0 (Sonoma) or later
            - Apple Silicon or Intel Mac

            ### Checksum
            ```
            SHA-256: ${{ steps.checksum.outputs.sha256 }}
            ```

            > Signed with Developer ID and notarized by Apple.
          files: |
            artifacts/VibeStudio-${{ steps.version.outputs.version }}.dmg

  # ---------------------------------------------------------------
  # Job 3: Publish Sparkle appcast to GitHub Pages
  # ---------------------------------------------------------------
  pages:
    name: Publish Appcast
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download appcast artifact
        uses: actions/download-artifact@v4
        with:
          name: appcast
          path: site/

      - name: Deploy appcast to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true
