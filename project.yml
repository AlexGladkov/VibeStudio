name: VibeStudio
options:
  bundleIdPrefix: tech.mobiledeveloper
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: false

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: "1.12.0"
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.76.0"
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    from: "2.29.0"
  swift-certificates:
    url: https://github.com/apple/swift-certificates.git
    from: "1.7.0"
  websocket-kit:
    url: https://github.com/vapor/websocket-kit.git
    from: "2.15.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.6.0"

targets:
  VibeStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources
    resources:
      - path: Sources/Assets.xcassets
      - path: Sources/Resources/en.lproj
      - path: Sources/Resources/ru.lproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.mobiledeveloper.vibestudio
        INFOPLIST_FILE: VibeStudio/Info.plist
        CODE_SIGN_ENTITLEMENTS: VibeStudio/VibeStudio.entitlements
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "18"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_STRICT_CONCURRENCY: targeted
        # TODO: Enable SWIFT_TREAT_WARNINGS_AS_ERRORS once Swift 6 concurrency warnings are resolved
        # SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    dependencies:
      - package: SwiftTerm
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-nio
        product: NIOWebSocket
      - package: swift-nio-ssl
        product: NIOSSL
      - package: swift-certificates
        product: X509
      - package: websocket-kit
        product: WebSocketKit
      - package: Sparkle
        product: Sparkle

  VibeStudioTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: VibeStudio
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VibeStudio.app/Contents/MacOS/VibeStudio"
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: true

schemes:
  VibeStudio:
    build:
      targets:
        VibeStudio: all
        VibeStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VibeStudioTests
    profile:
      config: Release
    analyze:
      config: Debug
